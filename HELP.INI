=MyLISP65 - HELPType one expression, then RETURN. Symbols ignore case.Expressions can span lines (maximum 500 characters).Quote: 'X or (QUOTE X). NIL is false; T is true.*SESSIONHELP                This help (without parentheses)BYE                 Finish (without parentheses)(STATUS)            Memory and depth peaks(SYMBOLS)           User definitions(CLEAN)             Collect unused objects(NEW)               Reset; asks for confirmation(LOAD "FILE.LSP")   Load a Lisp program from disk*DEFINITIONS AND CONTROL(DEFINE X 10)       Define a global value(DEFUN F (X) ...)   Define a function(LAMBDA (X) ...)    Create a function(LET ((X 2)) ...)   Local bindings(IF test yes no)    Conditional(COND (test ...))   Conditional clauses(PROGN ...)         Evaluate a sequence(AND ...) (OR ...)  Short-circuit logic(EVAL expr)         Evaluate data as code, global environment*PRIMITIVES+ - * /             Arithmetic: integers, rationals and floatsDIV MOD             Integer quotient and remainder= < > <= >=         Numeric comparisonsCAR CDR CONS LIST   List operationsAPPEND              Join two listsATOM EQ EQUAL NULL NOTNUMBERP SYMBOLP LISTPPRINT DISPLAY NEWLINESYMNAME STR< STRCAT*NUMBERSIntegers are exact 32-bit. 1/3 is an exact rational, not 0.333...Rationals are always reduced: (/ 2 4) is 1/2, (/ 4 2) is 2.A float anywhere in an expression makes the whole result a float.*LIMITS32768 cells, 512 symbols, 255 strings.Symbol names 15 characters, strings 63 (both truncated).*KEYBOARDRETURN ends the line. DELETE erases the last character.There is no cursor movement inside a line yet.*EXAMPLE: factorial (type these four lines)(DEFUN FACT (N)  (IF (<= N 1) 1    (* N (FACT (- N 1)))))(FACT 5)